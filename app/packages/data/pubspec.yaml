name: tarkov_companion_data
description: Bundle ingestion, local database, and repositories for Tarkov Companion.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  drift: ^2.35.4
  sqlite3: ^3.9.2
  tarkov_companion_core:
    path: ../core

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  lints: ^6.0.0
  test: ^1.25.0

# Regenerate the drift code after changing a table:
#
#   cd app/packages/data
#   dart run build_runner build
#
# The generated `lib/src/database/app_database.g.dart` is committed; CI does not
# run code generation.

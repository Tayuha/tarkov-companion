name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run obsolete. Pull requests from
# forks get their own group because `github.ref` is the merge ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        working-directory: pipeline
        run: npm ci

      - name: Lint
        working-directory: pipeline
        run: npm run lint

      - name: Test
        working-directory: pipeline
        run: npm test

      - name: Compile
        working-directory: pipeline
        run: npm run build

      - name: Validate fixtures
        working-directory: pipeline
        run: npm run validate:fixtures

      # Exercises the whole offline path against the committed fixtures, so a
      # broken bundler or gate fails here instead of in the scheduled sync.
      - name: Bundle fixtures
        working-directory: pipeline
        run: npm run bundle -- --all

      - name: Gate handbuilt bundle
        working-directory: pipeline
        run: npm run gate -- --dir ../test/fixtures/handbuilt-bundle

  app:
    name: App (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version in app/README.md so the Windows toolchain is
      # reproducible; `cache: true` keeps the SDK between runs keyed by version.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Cheap and platform-independent: catches a broken package edge before
      # the slower analyzer and build steps.
      - name: Check package architecture
        working-directory: app
        run: dart run tool/check_architecture.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Ingest benchmark (full items dataset)
        working-directory: app
        run: dart test packages/data -t benchmark -j 1

      # Secondary platform check. The primary benchmark runs on Linux; this
      # job keeps Windows compilation and ingestion honest while Windows
      # packaging is deferred. See docs/benchmark.md.
      - name: Ingest benchmark (full items dataset)
        working-directory: app
        run: dart test packages/data -t benchmark -j 1

      # The development host is Linux, so this is the only place the Windows
      # runner sources are compiled.
      - name: Build Windows app (debug)
        working-directory: app
        run: flutter build windows --debug

  app-linux:
    name: App (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Primary gate for the app while Linux is the release target. The Windows
    # job is a compatibility check until that platform resumes.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Import boundaries are checked on both desktop runners; package tests
      # run here once because they are platform-independent.
      - name: Check package architecture
        working-directory: app
        run: dart run tool/check_architecture.dart

      - name: Test workspace packages
        working-directory: app
        run: |
          dart test packages/core
          dart test packages/data --exclude-tags benchmark
          flutter test packages/features

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Builds the first-release Linux artifacts (AppImage, optional .deb and
    # SHA256SUMS). It uploads them for manual verification on a clean machine;
    # it does not tag, sign or publish a GitHub Release. Linux packaging is the
    # gate before Windows/mobile packaging resumes (design D9).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      # Flutter's Linux desktop build needs the GTK/CMake toolchain; dpkg-deb
      # ships with dpkg on the runner and produces the optional .deb.
      - name: Install Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Build Linux package
        run: bash scripts/package-linux.sh

      - name: Verify checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Inspect artifacts
        run: file dist/*.AppImage dist/*.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarkov-companion-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
